<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Пример</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .user-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f9f9f9;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Пользователи из JSONPlaceholder API</h1>
        <button id="loadBtn">Загрузить пользователей</button>
        <div id="usersContainer" class="loading">Нажмите кнопку, чтобы загрузить данные...</div>
    </div>

    <script>
        const usersContainer = document.getElementById('usersContainer');
        const loadBtn = document.getElementById('loadBtn');

        // Функция для загрузки пользователей
        async function loadUsers() {
            try {
                usersContainer.textContent = 'Загружаем данные...';
                
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                
                // Проверяем, что запрос успешен
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }
                
                const users = await response.json();
                
                // Очищаем контейнер и отображаем пользователей
                usersContainer.innerHTML = '';
                users.map(user => {
                    const userCard = document.createElement('div');
                    userCard.className = 'user-card';
                    userCard.innerHTML = `
                        <h3>${user.name}</h3>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Компания:</strong> ${user.company.name}</p>
                        <p><strong>Город:</strong> ${user.address.city}</p>
                    `;
                    usersContainer.appendChild(userCard);
                });
            } catch (error) {
                usersContainer.innerHTML = `<p style="color: red;">Ошибка загрузки данных: ${error.message}</p>`;
            }
        }

        // Обработчик клика по кнопке
        loadBtn.addEventListener('click', loadUsers);
    </script>
</body>
</html>
